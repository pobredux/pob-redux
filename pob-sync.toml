# Upstream Path of Building checkouts that pob-sync vendors into
# src-tauri/resources/pob (PoE2) and src-tauri/resources/pob1 (PoE1).
# Override with --source or POB_SOURCE.
#
# Bump `commit` deliberately: it is the upstream revision the engine has been
# validated against. pob-sync warns when the checkout's HEAD differs.
# Fixes upstream has not merged yet live in patches/<game>/; pob-sync applies them.

[poe2]
source_path = "../PathOfBuilding-PoE2"
commit = "e6129c54fb93c4fb8ae68fe45fd825c5ae1a1999"

[poe1]
source_path = "../PathOfBuilding"
commit = "16de4b82d57f1c0de6eb40f37143c32d4da36a02"
