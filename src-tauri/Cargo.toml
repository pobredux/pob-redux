[package]
name = "pob-redux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Path of Building for Path of Exile 1 and 2, rebuilt: Rust + Tauri shell around PoB's real calculation engines."
authors = ["Judd <ipajudd@gmail.com>"]

[lib]
name = "pob_redux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `tauri dev` runs with --no-default-features; plain cargo release builds embed the frontend
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pob-engine = { path = "../crates/pob-engine", default-features = false }
mimalloc.workspace = true
libmimalloc-sys = "0.1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
walkdir.workspace = true
rmcp = { version = "3.2", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
getrandom = "0.3"
regex = "1"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "macros", "process", "io-util", "time"] }

# The updater has no mobile target, so it is scoped to desktop.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true
