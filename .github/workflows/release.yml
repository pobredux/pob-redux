name: release

# Tag-driven. `git tag vX.Y.Z && git push --tags` builds both platforms, signs
# the updater artifacts, and creates a draft GitHub Release containing
# latest.json. Publish the draft to make the update available: the in-app
# updater reads the latest release's latest.json from the public repo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  # One job makes the draft, so parallel builds cannot each create their own for the same tag.
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Release notes need the history and tags a shallow clone lacks.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create the draft release, or reuse the one a rerun left
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            notes=$(bun scripts/release-notes.mjs "$TAG")
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="PoB Redux $TAG" -f body="$notes" -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: ubuntu-22.04-arm
            bundles: deb,rpm,appimage
          # macos-15 is an Apple Silicon runner, so this builds arm64 only --
          # the Intel half of a universal binary would need a second LuaJIT
          # build and nobody has asked for it.
          - os: macos-15
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read pinned PoB commits
        id: pin
        shell: bash
        run: |
          pin() { awk -v s="[$1]" '$0 == s {f=1; next} /^\[/ {f=0} f && /^commit/' pob-sync.toml | cut -d'"' -f2; }
          echo "commit=$(pin poe2)" >> "$GITHUB_OUTPUT"
          echo "commit1=$(pin poe1)" >> "$GITHUB_OUTPUT"

      # Same cache as check.yml, so a tag usually reuses the vendored trees
      # that main already produced for these pinned commits.
      - name: Cache vendored Path of Building
        id: pob
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/resources/pob
            src-tauri/resources/pob1
            src-tauri/resources/pob1-data
          key: pob-${{ runner.os }}-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.commit1 }}-${{ hashFiles('crates/pob-sync/**/*.rs', 'crates/pob-sync/Cargo.toml', 'pob-sync.toml', 'patches/**', 'trees/**') }}

      - name: Checkout PathOfBuilding-PoE2
        if: steps.pob.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding-PoE2
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream/PathOfBuilding-PoE2

      - name: Checkout PathOfBuilding (PoE1)
        if: steps.pob.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding
          ref: ${{ steps.pin.outputs.commit1 }}
          path: upstream/PathOfBuilding

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # setup-bun caches the bun binary, not downloaded packages.
      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: pob-redux-${{ runner.arch }}
          cache-on-failure: true

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev libclang-dev libfuse2

      - run: bun install --frozen-lockfile

      - name: Vendor Path of Building
        if: steps.pob.outputs.cache-hit != 'true'
        run: |
          cargo run -p pob-sync -- --source upstream/PathOfBuilding-PoE2
          cargo run -p pob-sync -- --game poe1 --source upstream/PathOfBuilding

      - name: Check the downloadable files are on R2
        run: bun scripts/downloads.ts check

      # Builds, signs the updater artifacts with the minisign key and uploads them with latest.json to the draft.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          uploadUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}

      # A bundle whose resources are not sealed opens as "damaged" once downloaded.
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict -vv "target/release/bundle/macos/PoB Redux.app"

      # Launch the AppImage on a virtual display and refuse a black window, the
      # failure WebKitGTK produces when its GPU path breaks. The script waits for
      # the window rather than sleeping a fixed time, which missed a cold start on
      # the runner and screenshotted an empty display. Advisory for now: the
      # screenshot is uploaded either way.
      - name: Smoke-test the AppImage
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          POB_REDUX_GAME: poe2
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get install -y xvfb imagemagick xdotool
          app=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          xvfb-run -a -s "-screen 0 1600x1000x24" bash scripts/smoke-appimage.sh "$app"

      - name: Upload the smoke screenshot
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-smoke-${{ runner.arch }}
          path: smoke.png
          if-no-files-found: ignore

  # Signed with the SignPath policy in this repository variable; unset builds unsigned.
  windows:
    needs: draft
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      signing-policy: ${{ vars.SIGNPATH_SIGNING_POLICY }}
      upload: true
    secrets: inherit

  # Matrix jobs each rewrite latest.json and can drop a platform when two finish together.
  updater-manifest:
    needs: [release, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: scripts
      - name: Rebuild latest.json from the uploaded signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/updater-manifest.mjs "$TAG" "$GITHUB_REPOSITORY"
