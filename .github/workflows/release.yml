name: release

# Tag-driven. `git tag vX.Y.Z && git push --tags` builds both platforms, signs
# the updater artifacts, and creates a draft GitHub Release containing
# latest.json. Publish the draft to make the update available: the in-app
# updater reads the latest release's latest.json from the public repo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          # macos-15 is an Apple Silicon runner, so this builds arm64 only --
          # the Intel half of a universal binary would need a second LuaJIT
          # build and nobody has asked for it.
          - os: macos-15
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Release notes are built from the log since the previous tag, and a
          # shallow clone carries neither history nor tags.
          fetch-depth: 0

      - name: Read pinned PoB commits
        id: pin
        shell: bash
        run: |
          pin() { awk -v s="[$1]" '$0 == s {f=1; next} /^\[/ {f=0} f && /^commit/' pob-sync.toml | cut -d'"' -f2; }
          echo "commit=$(pin poe2)" >> "$GITHUB_OUTPUT"
          echo "commit1=$(pin poe1)" >> "$GITHUB_OUTPUT"

      # Same cache as check.yml, so a tag usually reuses the vendored trees
      # that main already produced for these pinned commits.
      - name: Cache vendored Path of Building
        id: pob
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/resources/pob
            src-tauri/resources/pob1
          key: pob-${{ runner.os }}-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.commit1 }}-${{ hashFiles('crates/pob-sync/**/*.rs', 'crates/pob-sync/Cargo.toml', 'pob-sync.toml', 'patches/**') }}

      - name: Checkout PathOfBuilding-PoE2
        if: steps.pob.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding-PoE2
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream/PathOfBuilding-PoE2

      - name: Checkout PathOfBuilding (PoE1)
        if: steps.pob.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding
          ref: ${{ steps.pin.outputs.commit1 }}
          path: upstream/PathOfBuilding

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # setup-bun caches the bun binary, not downloaded packages.
      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: pob-redux
          cache-on-failure: true

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: bun install --frozen-lockfile

      # Both matrix jobs generate the same notes from the same commits, so
      # whichever creates the release first wins and the other matches.
      - name: Build release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            bun scripts/release-notes.mjs "${{ inputs.tag || github.ref_name }}"
            echo RELEASE_NOTES_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Vendor Path of Building
        if: steps.pob.outputs.cache-hit != 'true'
        run: |
          cargo run -p pob-sync -- --source upstream/PathOfBuilding-PoE2 --tree-assets
          cargo run -p pob-sync -- --game poe1 --source upstream/PathOfBuilding --tree-assets

      # Builds, signs the updater artifacts with the minisign key, creates or
      # updates the release, and generates latest.json from the signatures.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "PoB Redux ${{ inputs.tag || github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}

      # Launch the AppImage on a virtual display and refuse a black window, the
      # failure WebKitGTK produces when its GPU path breaks. The script waits for
      # the window rather than sleeping a fixed time, which missed a cold start on
      # the runner and screenshotted an empty display. Advisory for now: the
      # screenshot is uploaded either way.
      - name: Smoke-test the AppImage
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          POB_REDUX_GAME: poe2
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get install -y xvfb imagemagick xdotool
          app=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          xvfb-run -a -s "-screen 0 1600x1000x24" bash scripts/smoke-appimage.sh "$app"

      - name: Upload the smoke screenshot
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-smoke
          path: smoke.png
          if-no-files-found: ignore
